<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Saint Valentin ❤️ Zack</title>

<style>
body {
    margin:0;
    padding:0;
    background: linear-gradient(to bottom, #ff9ecf, #ff4d88);
    font-family: Arial, sans-serif;
    text-align:center;
    overflow:hidden;
    color:white;
}

h1 {
    margin-top:80px;
    font-size:50px;
}

.question {
    margin-top:40px;
    font-size:30px;
}

button {
    padding:15px 30px;
    font-size:20px;
    border:none;
    border-radius:30px;
    cursor:pointer;
    margin:20px;
}

#yes {
    background-color:#00e676;
    color:white;
}

#no {
    background-color:#ff1744;
    color:white;
    position:absolute;
}

.heart {
    position:fixed;
    top:-50px;
    font-size:25px;
    animation:fall linear infinite;
}

@keyframes fall {
    to { transform:translateY(100vh); }
}

/* POPUP */
.popup {
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.7);
    justify-content:center;
    align-items:center;
}

.popup-content {
    background:white;
    color:#ff4d88;
    padding:40px;
    border-radius:25px;
    text-align:center;
    animation:zoom 0.6s ease;
}

@keyframes zoom {
    from { transform:scale(0.3); opacity:0; }
    to { transform:scale(1); opacity:1; }
}
</style>
</head>

<body>

<h1>💖 Happy Saint Valentin Mon Amour Zack 💖</h1>

<div class="question">
    Acceptes-tu d'être mon Valentine ? 🥰
</div>

<button id="yes">Oui ❤️</button>
<button id="no">Non 😏</button>

<!-- POPUP -->
<div id="popup" class="popup">
  <div class="popup-content">
    <h2>😍 Mon Amour 😍</h2>
    <p>
      Je savais que tu choisirais ça ! 💕<br><br>
      Tu n’as pas le droit de dire non 😘<br><br>
      Je t’aime infiniment ❤️<br>
      zakou-iw le3mer - inu 💖
    </p>
  </div>
</div>

<!-- Musique romantique -->
<audio id="music" src="https://www.bensound.com/bensound-music/bensound-romantic.mp3"></audio>

<script>
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const popup = document.getElementById("popup");
const music = document.getElementById("music");

// Bouton NON qui fuit
noBtn.addEventListener("mouseover", () => {
    const x = Math.random() * (window.innerWidth - 100);
    const y = Math.random() * (window.innerHeight - 100);
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
});

// Quand il clique OUI
yesBtn.addEventListener("click", () => {
    popup.style.display = "flex";
    launchConfetti();
    music.play();
});

// Coeurs qui tombent
function createHeart() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (3 + Math.random() * 5) + "s";
    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 8000);
}
setInterval(createHeart, 300);

// Confettis
function launchConfetti() {
    for(let i=0; i<50; i++) {
        let confetti = document.createElement("div");
        confetti.innerHTML = "💖";
        confetti.style.position = "fixed";
        confetti.style.left = Math.random() * 100 + "vw";
        confetti.style.top = Math.random() * 100 + "vh";
        confetti.style.fontSize = "25px";
        document.body.appendChild(confetti);

        setTimeout(() => confetti.remove(), 2000);
    }
}
</script>

</body>
</html>
