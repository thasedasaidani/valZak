<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Saint Valentin ❤️</title>

<style>
body {
    margin:0;
    padding:0;
    background: linear-gradient(to bottom, #ff9ecf, #ff4d88);
    font-family: 'Arial', sans-serif;
    text-align:center;
    overflow:hidden;
    color:white;
}

h1 {
    margin-top:80px;
    font-size:50px;
}

.question {
    margin-top:40px;
    font-size:30px;
}

button {
    padding:15px 30px;
    font-size:20px;
    border:none;
    border-radius:30px;
    cursor:pointer;
    margin:20px;
    transition:0.3s;
}

#yes {
    background-color:#00e676;
    color:white;
}

#no {
    background-color:#ff1744;
    color:white;
    position:absolute;
}

.message {
    display:none;
    font-size:30px;
    margin-top:40px;
}

.heart, .teddy {
    position:fixed;
    top:-50px;
    font-size:30px;
    animation:fall linear infinite;
}

@keyframes fall {
    to {
        transform:translateY(100vh);
    }
}
</style>
</head>

<body>

<h1>💖 Happy Saint Valentin Mon Amour 💖</h1>

<div class="question">
    Acceptes-tu d'être mon Valentine ? 🥰
</div>

<button id="yes">Oui ❤️</button>
<button id="no">Non 😏</button>

<div class="message" id="finalMessage">
    😍 Je savais que tu choisirais ça !  
    <br><br>
    Tu n’as pas le droit de dire non 😘  
    <br><br>
    Je t’aime infiniment mon amour ❤️❤️❤️
</div>

<script>
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const finalMessage = document.getElementById("finalMessage");

noBtn.addEventListener("mouseover", () => {
    const x = Math.random() * (window.innerWidth - 100);
    const y = Math.random() * (window.innerHeight - 100);
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
});

yesBtn.addEventListener("click", () => {
    document.querySelector(".question").style.display = "none";
    yesBtn.style.display = "none";
    noBtn.style.display = "none";
    finalMessage.style.display = "block";
});

// Animation coeurs + nounours
function createFallingItem() {
    const item = document.createElement("div");
    item.classList.add(Math.random() > 0.5 ? "heart" : "teddy");
    item.innerHTML = Math.random() > 0.5 ? "❤️" : "🧸";
    item.style.left = Math.random() * 100 + "vw";
    item.style.animationDuration = (3 + Math.random() * 5) + "s";
    document.body.appendChild(item);

    setTimeout(() => {
        item.remove();
    }, 8000);
}

setInterval(createFallingItem, 300);
</script>

</body>
</html>
